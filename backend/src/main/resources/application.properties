# ============================================
# Налаштування сервера гри
#
# ЩО ЦЕ: тут написано, де шукати базу, під яким паролем і як поводитись.
# Формат простий — «ключ = значення».
#
# ⚠️ Значення у ${ФІГУРНИХ_ДУЖКАХ:запасне} читаються зі змінних оточення.
# Це щоб на справжньому сервері пароль брався з налаштувань хостингу,
# а не лежав у файлі, який видно на GitHub. Локально працює запасне
# значення після двокрапки.
# ============================================

spring.application.name=studlife-backend

# ---------- База даних ----------
# 5433 — порт, який ми задали в docker-compose.yml
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/studlife}
spring.datasource.username=${DB_USER:studlife}
spring.datasource.password=${DB_PASSWORD:studlife}

# ---------- Таблиці ----------
# Flyway сам створює таблиці за файлами з db/migration і стежить,
# які вже виконані. Тому база на будь-якому комп'ютері буде однакова.
spring.flyway.enabled=true

# Hibernate таблиці НЕ чіпає — цим займається виключно Flyway.
# 'validate' = «перевір, що таблиці збігаються з кодом, і нічого не міняй».
# Так помилка в описі сутності спливе одразу при старті, а не в проді.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# показувати SQL-запити в консолі — зручно, поки вчимось.
# ⚠️ На справжньому сервері вимикаємо (SHOW_SQL=false): по-перше, це тонни
# тексту в логах, по-друге, у запитах видно дані гравців.
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:true}

# ---------- ШІ (генерація карток) ----------
# ⚠️ КЛЮЧ ТУТ НЕ ПИШЕТЬСЯ. Він читається зі змінної оточення GEMINI_API_KEY —
# інакше потрапив би на GitHub, і його вкрали б за годину.
#
# ЯК ЗАДАТИ (PowerShell, перед запуском сервера):
#     $env:GEMINI_API_KEY = "твій-ключ"
#     .\gradlew.bat bootRun
#
# Порожній ключ — не помилка: сервер просто скаже грі «ШІ недоступний»,
# і вона гратиме на рукописних картках.
ai.gemini.key=${GEMINI_API_KEY:}

# Моделі пробуються по черзі: у найновішої найменший безкоштовний ліміт,
# тож коли він вичерпається, береться наступна.
ai.gemini.models=gemini-3.6-flash,gemini-3.5-flash,gemini-3.1-flash-lite

# Ліміти. Особистий захищає спільний ресурс від одного зловмисника,
# загальний — від «усі разом вигоріли за годину».
ai.limit.per-user-per-day=40
ai.limit.total-per-day=800

# Як часто картка буде продовженням попереднього вибору (0.35 ≈ кожна третя)
ai.followup-chance=0.35

# ---------- Сервер ----------
# ПОРТ — це «номер квартири» на твоєму комп'ютері, за яким до сервера
# звертатимуться. Дві програми на одному номері жити не можуть.
#
# Звичайний для розробки номер 8080 у тебе ВЖЕ ЗАЙНЯТИЙ сторонньою
# програмою (ApplicationWebServer), тому беремо сусідній — 8081.
# Гра стукатиме на http://localhost:8081
#
# ⚠️ На хостингу номер обираємо не ми: Render сам каже «слухай ось цей»
# через змінну PORT. Тому тут ${PORT:8081} — «візьми PORT, а як його нема,
# то 8081». Один рядок працює і вдома, і в інтернеті.
server.port=${PORT:8081}

# зрозумілі повідомлення про помилки замість голого коду
server.error.include-message=always

# ---------- COOKIE З НОМЕРКОМ СЕСІЇ ----------
# Після входу сервер видає браузеру cookie — «номерок гардероба».
# Браузер сам чіпляє його до кожного наступного запиту, і сервер розуміє, хто це.
#
# http-only=true — JavaScript цю cookie НЕ БАЧИТЬ взагалі. Навіть якщо на
# сторінку якимось чином потрапить чужий скрипт, украсти номерок він не зможе.
server.servlet.session.cookie.http-only=true

# ⚠️ SAME-SITE — найпідступніше місце всього переїзду.
#
# Гра лежить на mitsu-oi.github.io, а сервер буде на onrender.com. Для браузера
# це РІЗНІ САЙТИ, і за замовчуванням (Lax) він відмовляється надсилати cookie
# з одного сайту на інший — так він захищає від того, щоб лівий сайт діяв
# від твого імені.
#
# None = «так, я свідомо дозволяю надсилати між сайтами». Браузери приймають
# None ТІЛЬКИ разом із Secure (тобто лише через https).
#
# Вдома лишається Lax + без Secure, бо localhost працює по http, а Secure-cookie
# по http браузер просто викине, і вхід ламався б на рівному місці.
# На Render виставляємо COOKIE_SAMESITE=None і COOKIE_SECURE=true.
server.servlet.session.cookie.same-site=${COOKIE_SAMESITE:Lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---------- ЗВІДКИ ПУСКАЄМО (CORS) ----------
# Перелік сайтів, яким дозволено звертатись до сервера. Читає SecurityConfig.
# Кома між адресами, пробілів не треба.
#
# ⚠️ Зірочку «*» тут ставити НЕ МОЖНА: разом із cookie це означало б
# «будь-який сайт може діяти від імені залогіненого гравця».
#
# 'null' у кінці — це не помилка й не порожнє значення: саме так браузер
# називає сторінку, відкриту подвійним кліком з диска (file://).
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://mitsu-oi.github.io,http://localhost:8081,http://127.0.0.1:5500,null}
