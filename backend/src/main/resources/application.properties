# ============================================
# Налаштування сервера гри
#
# ЩО ЦЕ: тут написано, де шукати базу, під яким паролем і як поводитись.
# Формат простий — «ключ = значення».
#
# ⚠️ Значення у ${ФІГУРНИХ_ДУЖКАХ:запасне} читаються зі змінних оточення.
# Це щоб на справжньому сервері пароль брався з налаштувань хостингу,
# а не лежав у файлі, який видно на GitHub. Локально працює запасне
# значення після двокрапки.
# ============================================

spring.application.name=studlife-backend

# ---------- База даних ----------
# 5433 — порт, який ми задали в docker-compose.yml
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/studlife}
spring.datasource.username=${DB_USER:studlife}
spring.datasource.password=${DB_PASSWORD:studlife}

# ---------- Таблиці ----------
# Flyway сам створює таблиці за файлами з db/migration і стежить,
# які вже виконані. Тому база на будь-якому комп'ютері буде однакова.
spring.flyway.enabled=true

# Hibernate таблиці НЕ чіпає — цим займається виключно Flyway.
# 'validate' = «перевір, що таблиці збігаються з кодом, і нічого не міняй».
# Так помилка в описі сутності спливе одразу при старті, а не в проді.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# показувати SQL-запити в консолі — зручно, поки вчимось
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Сервер ----------
# ПОРТ — це «номер квартири» на твоєму комп'ютері, за яким до сервера
# звертатимуться. Дві програми на одному номері жити не можуть.
#
# Звичайний для розробки номер 8080 у тебе ВЖЕ ЗАЙНЯТИЙ сторонньою
# програмою (ApplicationWebServer), тому беремо сусідній — 8081.
# Гра стукатиме на http://localhost:8081
server.port=${PORT:8081}

# зрозумілі повідомлення про помилки замість голого коду
server.error.include-message=always
