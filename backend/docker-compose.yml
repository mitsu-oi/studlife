# ============================================
# База даних для гри — у контейнері Docker
#
# ЩО ЦЕ ТАКЕ (простими словами):
# Замість встановлювати PostgreSQL у Windows (а це майстер установки,
# служби, налаштування), ми запускаємо його в «коробці» — контейнері.
# Коробка ізольована від системи: не захаращує реєстр, не лишає служб,
# і видаляється однією командою разом з усім, що всередині.
#
# ЯК КОРИСТУВАТИСЬ (з папки backend):
#   docker compose up -d      — запустити базу (перший раз качає ~150 МБ)
#   docker compose ps         — подивитись, чи працює
#   docker compose stop       — зупинити (дані лишаються)
#   docker compose down -v    — ⚠️ видалити РАЗОМ З ДАНИМИ
#
# Дані живуть у томі pgdata і переживають перезапуск контейнера
# та перезавантаження комп'ютера.
# ============================================

services:
  db:
    image: postgres:17-alpine   # 17 — свіжа версія; alpine = легкий образ
    container_name: studlife-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: studlife       # назва бази
      POSTGRES_USER: studlife     # користувач
      # Пароль лише для локальної розробки на твоєму комп'ютері.
      # На справжньому сервері пароль береться з налаштувань хостингу,
      # а не з цього файлу.
      POSTGRES_PASSWORD: studlife

    ports:
      # лівий бік — порт на твоєму комп'ютері, правий — усередині контейнера.
      # 5433, а не стандартний 5432, щоб не конфліктувати, якщо колись
      # поставиш PostgreSQL у систему.
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    # Docker сам перевіряє, чи база вже готова приймати запити
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studlife -d studlife"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
