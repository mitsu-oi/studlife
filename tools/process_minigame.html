<!DOCTYPE html>
<meta charset="utf-8">
<title>Обробка спрайтів мінігри</title>
<!--
  process_minigame.html — обробник спрайтів для мінігри «Борис біжить».

  ЩО РОБИТЬ (усе автоматично):
  1) ХРОМАКЕЙ — прибирає кольоровий фон (маджента/малиновий), беручи його
     колір із кутів картинки. Допуск підібраний так, щоб не з'їдало предмет.
  2) НАЙБІЛЬШИЙ ОСТРІВЕЦЬ — лишає тільки головний предмет, а дрібні плями
     (вотермарка-зірочка в кутку, сміття) викидає.
  3) ОБРІЗКА — зрізає всі порожні краї впритул до предмета.
  4) МАСШТАБ — зменшує до розміру, заданого в TARGETS (висота фіксована,
     ширина рахується за пропорцією, щоб нічого не сплющило).

  ЯК ЗАПУСТИТИ (по одному спрайту за раз, ім'я — у хеші):
  chrome --headless --allow-file-access-from-files --default-background-color=00000000
         --window-size=<W>,<H> --screenshot=out.png
         "tools/process_minigame.html#slipper"

  Розмір вікна має збігатися з розміром результату — його друкує сама
  сторінка в заголовку (і в консоль).
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; image-rendering: auto; }
</style>
<body>
<canvas id="c"></canvas>
<script>
// Цільові розміри на полі гри (760×260).
// h — висота в пікселях поля; ширину рахуємо за пропорцією оригіналу.
// Висоти підібрані так, щоб усе було комфортно перестрибувати:
// стрибок Бориса піднімає його приблизно на 120 px.
// Борис на полі — приблизно 40×24, тож перешкоди мають бути помітно
// більшими за нього: тарган не може бути більшим за тапок.
const TARGETS = {
  slipper: { h: 46 },  // тапок лежить — низький і широкий
  spray:   { h: 66 },  // балончик стоїть — високий, найскладніша перешкода
  puddle:  { h: 22 },  // калюжа — майже пласка, найлегша
  shoe:    { h: 56 },  // кросівок — найбільший
};

const name = (location.hash || '#slipper').slice(1);
const target = TARGETS[name] || { h: 40 };

const img = new Image();
img.onload = () => process(img);
// Джерела (маджента-фон, як згенеровані) лежать в assets/source/minigame/,
// готові спрайти йдуть в assets/sprites/minigame/ — те саме розділення,
// що й для персонажів і предметів.
img.onerror = () => document.title = `ПОМИЛКА: не знайдено assets/source/minigame/${name}.png`;
img.src = `../assets/source/minigame/${name}.png`;

function process(img) {
  // --- 1. читаємо оригінал ---
  const src = document.createElement('canvas');
  src.width = img.width; src.height = img.height;
  const sctx = src.getContext('2d', { willReadFrequently: true });
  sctx.drawImage(img, 0, 0);
  const data = sctx.getImageData(0, 0, src.width, src.height);
  const px = data.data;
  const W = src.width, H = src.height;

  // --- 2. колір фону — усереднюємо чотири кути ---
  const corner = (x, y) => {
    const i = (y * W + x) * 4;
    return [px[i], px[i + 1], px[i + 2]];
  };
  const corners = [corner(2, 2), corner(W - 3, 2), corner(2, H - 3), corner(W - 3, H - 3)];
  const bg = [0, 1, 2].map(k => Math.round(corners.reduce((s, c) => s + c[k], 0) / 4));

  // --- 3. хромакей: прибираємо МАДЖЕНТУ (той самий критерій, що у
  // process_chars.html — він перевірений на аркушах персонажів).
  //
  // Ідея: маджента = багато червоного І синього, мало зеленого.
  // Чому не «відстань до кольору фону»: малиновий фон і КОРИЧНЕВА шкіра
  // тапка близькі за відстанню, і предмет вицвітав разом із фоном.
  const near = (i) => {
    const r = px[i], g = px[i + 1], b = px[i + 2];
    return r > 60 && b > 60 && g < Math.min(r, b) * 0.55;
  };
  const solid = new Uint8Array(W * H); // 1 = піксель предмета
  for (let p = 0; p < W * H; p++) {
    const i = p * 4;
    if (near(i)) { px[i + 3] = 0; } else { solid[p] = 1; }
  }

  // --- 4. найбільший «острівець» — щоб позбутись вотермарки й сміття ---
  const label = new Int32Array(W * H).fill(-1);
  const stack = [];
  let best = -1, bestSize = 0;
  for (let start = 0; start < W * H; start++) {
    if (!solid[start] || label[start] !== -1) continue;
    const id = start;
    let size = 0;
    stack.push(start); label[start] = id;
    while (stack.length) {
      const p = stack.pop(); size++;
      const x = p % W, y = (p / W) | 0;
      const nb = [];
      if (x > 0) nb.push(p - 1);
      if (x < W - 1) nb.push(p + 1);
      if (y > 0) nb.push(p - W);
      if (y < H - 1) nb.push(p + W);
      for (const q of nb) {
        if (solid[q] && label[q] === -1) { label[q] = id; stack.push(q); }
      }
    }
    if (size > bestSize) { bestSize = size; best = id; }
  }
  // все, що не належить головному острівцю — прозоре
  for (let p = 0; p < W * H; p++) {
    if (solid[p] && label[p] !== best) px[p * 4 + 3] = 0;
  }
  sctx.putImageData(data, 0, 0);

  // --- 5. обрізка порожніх країв ---
  // Ігноруємо МАЙЖЕ прозорі пікселі (alpha < 30): від згладжування лишається
  // ледь помітний обідок, і через нього спрайт «висів» над підлогою в грі.
  const ALPHA_MIN = 30;
  let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let p = 0; p < W * H; p++) {
    if (px[p * 4 + 3] < ALPHA_MIN) continue;
    const x = p % W, y = (p / W) | 0;
    if (x < minX) minX = x;
    if (x > maxX) maxX = x;
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  }
  const cw = maxX - minX + 1, ch = maxY - minY + 1;

  // --- 6. масштаб під цільову висоту, ширина за пропорцією ---
  const outH = target.h;
  const outW = Math.max(1, Math.round(cw * (outH / ch)));

  const out = document.getElementById('c');
  out.width = outW; out.height = outH;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';
  octx.drawImage(src, minX, minY, cw, ch, 0, 0, outW, outH);

  // розмір результату — у заголовок (звідти його читає скрипт запуску)
  document.title = `${name} ${outW}x${outH}`;
  console.log(`${name}: оригінал ${W}x${H} → обрізано ${cw}x${ch} → результат ${outW}x${outH}`);
}
</script>
</body>
